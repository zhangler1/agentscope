# ============================================================
# bocom-starter 部署：agentscope 单服务（生产 Redis 由平台注入，不自建）
# 构建：docker compose -f bocom-starter/docker-compose.yml build
#   （build.context=.. 交付物根，dockerfile=bocom-starter/Dockerfile，镜像自包含）
# 运行：docker compose -f bocom-starter/docker-compose.yml up -d
# 多实例：改端口变量 + -p project 名（容器/网络/volume 全隔离）
# ============================================================
services:
  agentscope:
    # 自包含镜像：SDK / bocom-as / bocom-starter 代码全部打进镜像
    # （生产模式，运行时无需挂载源码；开发调试请本地直跑 uvicorn）
    build:
      context: ..
      dockerfile: bocom-starter/Dockerfile
    image: agentscope-service:bocom
    ports: ["${AGENTSCOPE_HOST_PORT:-8000}:8000"]
    env_file:
      # 默认值复用 .env（注释行自动忽略）；生产 Redis 地址与行内配置
      # （ELLM_*、各 API key）由 CI/CD 平台环境变量注入
      - .env
    environment:
      - DASHSCOPE_API_KEY
      - OPENAI_API_KEY
      - ANTHROPIC_API_KEY
      # 生产 Redis（平台注入；environment 优先于 env_file 的 localhost 默认值，
      # 宿主未注入时容器内退化为 .env 默认值——仅本地直跑/端口转发场景可用）
      - REDIS_HOST
      - REDIS_PORT
      - ELLM_REDIS_HOST
      - ELLM_REDIS_PORT
      # bocom-as 顶层包（config / providers）经 PYTHONPATH 导入
      - PYTHONPATH=/app/bocom-as
    volumes:
      # 工作区数据持久化（含长期记忆 Markdown 文件）
      - workspace-data:/app/bocom-starter/workspaces
      # Docker Socket（支持 Docker 工作区沙箱）
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  workspace-data:
