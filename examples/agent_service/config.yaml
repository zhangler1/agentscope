# ==========================================================
# BocomADP 唯一配置源（config.yaml）
# 复制模板：cp config.yaml.example config.yaml
#
# 读取优先级（高 → 低）：
#   ① 进程环境变量（BOCOMADP_* 前缀，嵌套字段用 __ 分隔，如
#      BOCOMADP_REDIS__HOST）—— 部署期覆盖，优先级最高
#   ② .env 文件（agent_service/.env 中的 BOCOMADP_* 键）
#   ③ 本文件 config.yaml（含 $VAR / ${VAR} 环境变量引用展开）—— 主配置源
#   ④ 代码默认值（bocomadp/config/）
#
# 框架级参数（log_level / logging / service / redis /
# tools / middlewares / mcp / providers）与业务配置（models /
# app_name / workspace_dir）统一在本文件声明；
# 部署期需要临时覆盖时用 BOCOMADP_* 环境变量（优先级高于本文件）。
# ==========================================================

# ---------- 服务 ----------
# Web UI 标题与健康检查展示的应用名
app_name: "交通银行智能体平台"

# ---------- 日志 ----------
# 调试技能/工具链路时改为 debug（agent 事件流、工具调用、沙箱执行细节）
log_level: debug
logging:
  enhance:
    enabled: true          # trace_id 关联日志增强（TraceContextFilter + 格式化）
    format: text           # text | json（json 推荐生产环境）

# ---------- HTTP 服务 ----------
service:
  host: 0.0.0.0
  port: 8000
  reload: false            # 仅开发期开启 uvicorn 自动重载

# ---------- 数据库（AgentScope 持久化存储 / AsyncSQLAlchemyStorage） ----------
db:
  url: "postgresql+asyncpg://agentscope:agentscope@localhost:5432/agentscope"
  create_tables: true        # dev/单机自动建表；多副本生产改用 alembic upgrade head
  pool_pre_ping: true        # 取连接前探测存活，服务端静默断连时自动重建
  pool_recycle: 1800         # 空闲连接 30 分钟回收，早于防火墙/NAT 空闲超时

# ---------- ELLM apikey 提前刷新窗口 ----------
# 默认提前 120s 换新
ellm_key_refresh:
  refresh_ahead_secs: 120


# ---------- Redis（消息总线 / 分布式锁 / 缓存） ----------
# 存储后端已迁至上方 db（AsyncSQLAlchemyStorage）；Redis 仅保留给
# RedisMessageBus 等瞬时协调用途。当前 main.py 用 InMemoryMessageBus，
# 此段为预留，多 worker 时切 RedisMessageBus 即用。
redis:
  host: localhost
  port: 6379

# /chat 并发控制(0=不限)
run_concurrency:
  enabled: false
  max_running: 2
  max_running_per_user: 1
  grace_secs: 30

# ---------- 组件注册表 ----------
# 三大 registry（工具 / agent 中间件 / MCP）统一开关：
# enabled 控制内置组件扫描，load_custom 控制 custom/ 目录自动扫描。
tools:
  enabled: true
  load_custom: true

middlewares:
  enabled: true
  load_custom: true

mcp:
  enabled: true
  load_custom: true

# ---------- 模型 Provider（启动时自动注册到 ProviderManager） ----------
providers:
  enabled: true
  config_file: null        # null 表示使用本文件（config.yaml）；可指向其他 YAML

models:
  # 支持的 provider_type (简写即可):
  #   deepseek / openai / anthropic / dashscope / gemini
  #   ollama / moonshot / xai
  # 也可写全称: deepseek_credential / openai_credential / ...
  #
  # api_key 支持两种写法：
  #   1. ${ENV_VAR}  — 从环境变量读取（推荐，避免硬编码密钥）
  #   2. sk-xxx      — 直接写明文（仅限本地开发）
  #
  # parameters 中的字段会透传给对应 ChatModel 的 Parameters 模型，
  # 例如 DeepSeekChatModel.Parameters 支持:
  #   temperature / max_tokens / top_p / thinking_enable / reasoning_effort
  #
  # supports_thinking 供 deer-flow 前端模型选择器展示 thinking 开关
  #（默认 false）；仅影响前端展示，后端以 parameters 为准。
  - provider_id: deepseek
    display_name: "DeepSeek Chat"
    provider_type: deepseek
    model_name: deepseek-chat
    api_key: ${DEEPSEEK_API_KEY}
    base_url: https://api.deepseek.com
    is_active: true
    supports_multimodal: false
    supports_thinking: true
    parameters:
      temperature: 0.7
      max_tokens: 4096
      thinking_enable: false

  - provider_id: deepseek-v4-flash
    display_name: deepseek-v4-flash
    provider_type: bocom_ellm
    model_name: deepseek-v4-flash
    api_key: "1111111111"
    base_url: https://api.deepseek.com
    scene_code: P2024146
    api_key_url: http://host.docker.internal:9100/createSceneApiKey.do
    is_active: true
    supports_multimodal: false
    parameters:
      temperature: 0.3
      max_tokens: 8192

  # --- 取消注释以启用更多 provider ---
  # - provider_id: deepseek-reasoner
  #   display_name: "DeepSeek Reasoner (R1)"
  #   provider_type: deepseek
  #   model_name: deepseek-reasoner
  #   api_key: ${DEEPSEEK_API_KEY}
  #   base_url: https://api.deepseek.com
  #   is_active: false
  #   supports_multimodal: false
  #   supports_thinking: true
  #   parameters:
  #     thinking_enable: true
  #     reasoning_effort: high

  # === 多模态模型（工具专用） ===
  # 统一多模态模型**不再**从 config.yaml 配置：一律经 PG runtime_configs 表
  # view_image 配置段（PUT /api/config/view_image，字段：enabled / user_id /
  # credential_id / model_name，enabled=true 时三者必填），凭证按 user_id +
  # credential_id 查库；无记录/未启用时 view_image_tool 提示未配置（不构建模型）。
  # 图片解析链路：上传图片（jpg/jpeg/png/webp）→ 上传时转 base64 固化到
  # 上传元数据（SQLite）→ Agent 调用 list_uploaded_files 发现文件（列表中
  # 图片标注为 [图片] 并带 virtual_path）→ 调用 view_image_tool(virtual_path,
  # question) → 工具从元数据直读 base64 并调用统一多模态模型解析。
  # 注意：不要在 providers/_models/ 中添加对应候选卡——前端凭证表单的 model
  # 下拉来自候选卡；该模型由后端配置注入，不应出现在前端（前端只配主模型）。
  #
  # --- 行内（企业 ELLM 网关；已弃用，勿重新启用——即便启用也不再被消费） ---
  # - provider_id: qwen3-vl-30b
  #   display_name: "Qwen3 VL 30B A3B Instruct (多模态)"
  #   provider_type: bocom_ellm
  #   model_name: Qwen3-VL-30B-A3B-Instruct
  #   api_key: ${ELLM_API_KEY}
  #   base_url: ${ELLM_BASE_URL}
  #   scene_code: ${ELLM_SCENE_CODE}
  #   api_key_url: ${ELLM_API_KEY_URL}
  #   is_active: false
  #   supports_multimodal: true
  #   parameters:
  #     temperature: 0.3
  #     max_tokens: 8192
  

  # - provider_id: openai
  #   display_name: "GPT-4o"
  #   provider_type: openai
  #   model_name: gpt-4o
  #   api_key: ${OPENAI_API_KEY}
  #   base_url: https://api.openai.com/v1
  #   is_active: false
  #   supports_multimodal: true
  #   parameters:
  #     temperature: 0.7


# ---------- 运行时目录 ----------
# 工作区目录（AgentScope 沙箱文件读写根目录 + 会话持久化根目录：
# sessions/{user_id}/{agent_id}/{session_id}.json）
# 支持 $VAR 环境变量引用展开
workspace_dir: "./workspaces"


# ---------- 跨知识搜索 ----------
# 扁平结构：键与 cross_search_config.py 字段一一对应。
# 字符串值支持 $VAR / ${VAR} 环境变量引用展开（如 api_url: $CROSS_SEARCH_API_URL）。
cross_search:
  # api_url 支持环境变量引用展开，运行时需设置 CROSS_SEARCH_API_URL
  api_url: $CROSS_SEARCH_API_URL
  timeout: 30
  caller: "VD2026000"
  search_type: "0"
  text_top_n: 5
  vector_top_n: 5
  qa_type: [0, 1]
  attach_flag: 1
  rerank_flag: 1
  rewrite_flag: "ON"
  rerank_top_n: 5
  rerank_rule_code: "RR0005"
  vector_min_score: 0.54
  user_role: "0"
  space_code_list: []
  team_space_code_list: []
  user_code: "U000000000000000"
  psnl_space_code_id: "PER754964863350213"
  psnl_category_id_list: []
  second_search_kb_codes: []
  headers:
    Accept: "*/*"
    Accept-Encoding: "gzip, deflate, br"
    Connection: "keep-alive"
    Content-Type: "multipart/form-data"
    jumpcloud-ENV: "BASE"


# ---------- 联网搜索（online_search，含 custom_search 请求逻辑） ----------
# 扁平结构：键与 online_search_config.py 字段一一对应。
online_search:
  # 指向本地 mock（examples/agent_service/mock_search_server.py）：
  #   python mock_search_server.py  # 监听 0.0.0.0:8001
  # 生产/联调真实网关时改回环境变量引用：api_url: $CUSTOM_SEARCH_API_URL
  api_url: "http://127.0.0.1:8001/online"
  timeout: 30
  max_results: 5

# ---------- 个人知识库搜索（personal_search） ----------
personal_search:
  # 指向本地 mock；真实网关时改回：api_url: $PERSONAL_SEARCH_API_URL
  api_url: "http://127.0.0.1:8001/personal"
  timeout: 30                         # 请求超时(秒)
  source_type: "WDZS"                 # 请求体 sourceType
  repository: "personal-search"       # 请求体 repository
  search_type: "0"                    # 请求体 searchType
  headers:                            # 可选：合并覆盖默认头
    jumpCloud-Env: "BASE"

# ---------- 行内搜索（vector_search） ----------
vector_search:
  # 指向本地 mock；真实网关时改回：api_url: $VECTOR_SEARCH_API_URL
  api_url: "http://127.0.0.1:8001/vector"
  timeout: 30
  page_size: 10
  text_top_n: 7
  vector_top_n: 10
  space_codes: ["SP0999999", "SP0000214"]

# ---------- 外数查（raw_request） ----------
# 扁平结构：键与 raw_request_config.py 字段一一对应。
raw_request:
  # 测试环境联机根地址（9 个接口路径固定，域名可切）。
  # 生产/联调真实网关时改回：api_url: $RAW_REQUEST_API_URL
  api_url: "http://12.244.66.225"
  timeout: 30


# ---------- 利率汇率（rate_currency：汇率查询 + 利率查询） ----------
# 根地址与原 deerflow 工程一致；生产环境可用 $RATE_CURRENCY_API_URL 切换。
rate_currency:
  api_url: "http://12.244.167.46"
  timeout: 30


# ---------- 通讯录查询（contact_search） ----------
# 扁平结构：键与 contact_search_config.py 字段一一对应。
# api_url 支持环境变量引用展开，运行时需设置 CONTACT_SEARCH_API_URL。
contact_search:
  api_url: $CONTACT_SEARCH_API_URL
  timeout: 30
  headers:                            # 可选：合并覆盖默认头
    jumpCloud-Env: "BASE"


# ---------- 物理系统负责人查询（physical_contact_search） ----------
# 扁平结构：键与 physical_contact_search_config.py 字段一一对应。
# api_url 支持环境变量引用展开，运行时需设置 PHYSICAL_CONTACT_SEARCH_API_URL。
physical_contact_search:
  api_url: $PHYSICAL_CONTACT_SEARCH_API_URL
  timeout: 30
  headers:                            # 可选：合并覆盖默认头
    jumpCloud-Env: "BASE"


# ---------- 文件上传能力 ----------
# 非图片文件上传 / 格式转换（-> Markdown）/ 上下文注入。
# base_dir 为独立上传根（不挂在 workspace 下），相对路径基于 BASE_DIR 归一化。
# 支持文本/代码、PDF、Word、PPT、Excel、HTML 转 .md；图片在接口层拒绝；
# 其余格式（压缩包等）暂不支持。
uploads:
  enabled: true
  base_dir: "./uploads"          # 上传文件根目录 {base}/{user_id}/sessions/{session_id}/files/
  max_file_size_mb: 50.0         # 单文件大小上限（MB）
  max_files_per_session: 50       # 单会话最大文件数
  streaming_threshold_mb: 10.0    # 超过此阈值走流式/分块上传（MB）
  max_pdf_pages: 1000            # PDF 页数上限（超出拒绝）
  max_filename_length: 255       # 文件名最大长度

