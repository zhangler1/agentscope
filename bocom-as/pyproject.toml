[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bocom-as"
version = "0.1.0"
description = "交通银行行内模型平台扩展包：公共配置（config）+ 行内模型平台（providers），依赖行内 agentscope SDK"
requires-python = ">=3.11"
# 行内模型平台扩展：SDK（agentscope）从行内 pip 源安装（==2.0.7.post1），
# 不再随包分发 SDK 源码；本包只含 config / providers。
dependencies = [
    # 行内 SDK（行内 pip 源安装，核心依赖由其自带）
    "agentscope==2.0.7.post1",
    # ---- bocom-starter 部署必需（若行内 agentscope 发行已并入 extras，
    # ---- 重复声明无冲突，可精简）----
    "fastapi",
    "uvicorn",
    "apscheduler",
    "ag-ui-protocol>=0.1.10",
    "redis",
    "aiodocker",
    # ---- providers 直接依赖 ----
    "httpx",
    "pydantic",
]

# 包发现：仅 ./ 下的 config / providers 顶层子包（src/agentscope 不在发行范围，
# 相互之间以顶层包名互引）。
[tool.setuptools.packages.find]
where = ["."]
exclude = ["*.egg-info*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
# "*" 应用到所有发现的包：_models 为模型候选数据目录（无 __init__.py，非包，
# 随源码分发，Redis 不可用时降级读取）。
"*" = [
    "_models/*.yaml",
]
