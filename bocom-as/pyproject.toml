[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bocom-as"
version = "0.1.0"
description = "交通银行行内定制 agentscope 发行版：核心 SDK（src/agentscope）+ 行内模型平台（providers）"
requires-python = ">=3.11"
# 自包含单发行版：SDK 源码随包分发（src/agentscope），依赖全量并入主列表
# （SDK 全部依赖 + service / storage-redis / storage-mysql(SQL 存储) /
# workspace-docker 部署必需 extras）
dependencies = [
    # pip 源安装
    "agentscope==2.0.5",
    # ---- bocom-starter 部署必需（若行内 agentscope 发行已并入 extras，
    # ---- 重复声明无冲突，可精简）----
    "fastapi",
    "uvicorn",
    "apscheduler",
    "ag-ui-protocol>=0.1.10",
    "redis",
    "aiodocker",
    # ---- SQL 存储后端（应用主存储，已从 Redis 迁至数据库）----
    # OceanBase 兼容 MySQL 协议，驱动 aiomysql（官方 storage-mysql extra 同款）；
    # 具体 async 驱动由部署方自选，此处并入官方 storage-sql / storage-mysql 依赖。
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "aiomysql",
    # ---- providers 直接依赖 ----
    "httpx",
    "pydantic",
]

# 包发现：src/ 下为 agentscope SDK 包树，./ 下为 config / providers 顶层子包
# （相互之间以顶层包名互引）。src/agentscope.egg-info 等非包目录自动跳过。
[tool.setuptools.packages.find]
where = ["src", "."]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
# "*" 应用到所有发现的包：py.typed 标记 PEP 561；_models/_cosyvoice_models
# 为各模型供应商的数据目录（无 __init__.py，非包，随源码分发）。
"*" = [
    "py.typed",
    "_models/*.yaml",
    "_cosyvoice_models/*.yaml",
]
# Docker 工作区沙箱模板文件
"agentscope.workspace._docker" = ["Dockerfile*.template"]
# SQL 存储后端的 Alembic 脚手架（无 __init__.py，Alembic 按文件路径加载）
"agentscope.app.storage._sql" = [
    "_alembic/alembic.ini",
    "_alembic/script.py.mako",
    "_alembic/env.py",
    "_alembic/versions/*.py",
]
