services:
  redis:
    image: redis:7-bookworm
    ports: ["6389:6379"]
    volumes:
      - redis-data:/data


  mysql:
    # mysql:8.0：与 OceanBase 的 MySQL 兼容模式（以 8.0 为基准）最贴近，
    # 后续切 OceanBase 仅需改连接串 host，驱动与代码不变
    image: mysql:8.0
    ports: ["3306:3306"]
    environment:
      # 与 db.url 凭据保持一致
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=agentscope
      - MYSQL_USER=agentscope
      - MYSQL_PASSWORD=agentscope
      - TZ=Asia/Shanghai
    command:
      # utf8mb4：消息/Agent 配置含中文与 emoji，默认 latin1 会报错
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # 就绪探测：agentscope-service 等待其 healthy 后再启动
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uagentscope -pagentscope --silent"]
      interval: 5s
      timeout: 5s
      retries: 10

  agentscope-service:
    # 构建上下文为仓库根目录（与 Dockerfile 注释一致）
    # build:
    #   context: ..
    #   dockerfile: examples/agent_service/Dockerfile
    # image: agentscope-service:latest
    image: agentscope-service:mysql
    command: ["python", "main.py"]
    ports: ["8000:8000"]
    # 相对本文件目录（Docker-agentscope/.env），含 DEEPSEEK_API_KEY 等密钥
    env_file: .env
    environment:
      - AGENTSCOPE_OSS_KEY=6lHgmYV7R36Bk5AyHFgyz4f9a0SL30TbaeHDJTPOS5M=
      - TZ=Asia/Shanghai
      # 注意：AppConfig 只识别 BOCOMADP_ 前缀（嵌套字段用 __ 分隔），
      # 裸 REDIS_HOST 不会生效，会导致容器内连 localhost:6379 失败
      - BOCOMADP_REDIS__HOST=redis
      # 数据库：容器内走 mysql 服务（config.yaml 默认 localhost 无法直连）
      # 回退 postgres：postgresql+asyncpg://agentscope:agentscope@postgres:5432/agentscope
      - BOCOMADP_DB__URL=mysql+aiomysql://agentscope:agentscope@mysql:3306/agentscope
      # K8s 沙箱：kubeconfig 挂载自宿主机 .kube/config（容器内路径）
      - ADP_K8S_KUBECONFIG=/app/kubeconfig/config
      - ADP_K8S_ENABLED=true
      - BOCOMADP_TOOL_ASCII_NAMES=0
    depends_on:
      redis:
        condition: service_started
      mysql:
        condition: service_healthy
    volumes:
      # 挂载源码（可编辑模式）
      - ../src:/app/src:ro
      - ../examples/agent_service/main.py:/app/main.py:ro
      # 挂载配置（config.yaml 位于 /app/config.yaml，与 BASE_DIR 解析一致）
      - ../examples/agent_service/config.yaml:/app/config.yaml:ro
      # 外层产品包：挂载到 /app/bocomadp，随 main.py 一同被 import
      # （企业扩展原 bankcomm_adp 已整合进 bocomadp，无需单独挂载）
      - ../examples/agent_service/bocomadp:/app/bocomadp:ro
      - ../pyproject.toml:/app/pyproject.toml:ro
      - ../README.md:/app/README.md:ro
      # 工作区数据持久化（bind mount：验证后可直接在宿主机查看会话落盘文件
      # workspaces/sessions/{user_id}/{agent_id}/{session_id}.json）
      - ../examples/agent_service/workspaces:/app/workspaces
      # Docker Socket（支持 Docker 工作区沙箱）
      - /var/run/docker.sock:/var/run/docker.sock
      # K8s kubeconfig（K8s 沙箱模式必需）
      - ./config:/app/kubeconfig/config:ro
      # AgentScope ``as`` logger 文件输出（与 main.py 中默认路径一致）
      - ./logs:/app/logs

  # 反向代理网关：统一入口（http://localhost:80）
  # /api/* → webui-backend:3000，其余 → 前端（dev:5173 / prod:80）
  nginx:
    image: nginx:alpine
    ports: ["9080:80"]
    volumes:
      # 以模板方式挂载，启动时经 envsubst 渲染为实际配置
      - ./nginx/nginx.conf:/etc/nginx/templates/default.conf.template:ro
    depends_on: [agentscope-service]

volumes:
  redis-data:
  pg-data:
  mysql-data:
