services:
  redis:
    image: redis:7-bookworm
    # 宿主端口可参数化（多实例时用不同端口，如 REDIS_HOST_PORT=6380）
    ports: ["${REDIS_HOST_PORT:-6379}:6379"]
    volumes:
      - redis-data:/data

  agentscope:
    # 默认复用 agentscope-service:oss 镜像（镜像提供 Python 依赖环境，
    # bocom-starter/main.py 由 volume 挂载——dev 模式）。
    # 注意：SDK（agentscope）与 bocom-as（config/providers）均已 whl 固化
    # 在镜像 .venv 内，不再源码挂载；平台变更需重建 whl 并 --build 重建镜像。
    # --build 时以交付物根（bocom-docker 父目录，含 bocom-as / bocom-starter）
    # 为上下文构建镜像（bocom-docker/Dockerfile，依赖与 bocom-as 发行版绑定）；
    # 构建会覆盖同 tag 镜像，如需保留 oss 镜像先备份：
    #   docker tag agentscope-service:oss agentscope-service:oss.bak
    build:
      context: ..
      dockerfile: bocom-docker/Dockerfile
    image: agentscope-service:oss
    ports: ["${AGENTSCOPE_HOST_PORT:-8000}:8000"]
    env_file:
      # 行内模型平台配置直接复用 bocom-starter/.env（容器内生效，
      # 注释行自动忽略）；其中 localhost 类地址由下方 environment
      # 覆盖为容器网络服务名（compose 规范：environment 优先于 env_file）
      - ../bocom-starter/.env
    environment:
      - DASHSCOPE_API_KEY
      - OPENAI_API_KEY
      - ANTHROPIC_API_KEY
      # 容器网络内地址覆盖（.env 中的 localhost 仅适用于宿主机直跑）
      # 主存储 DATABASE_URL（OB）经 env_file 传入；容器内访问宿主机
      # OB 需指向 host.docker.internal（Linux 需 extra_hosts host-gateway）
      - ELLM_REDIS_HOST=redis
    depends_on: [redis]
    volumes:
      # 挂载 bocom-starter 启动程序（可热改，uvicorn reload 自动生效）；
      # bocom-as / SDK 为 whl 依赖，固化在镜像内，不在此挂载
      - ../bocom-starter/main.py:/app/main.py:ro
      # 工作区数据持久化
      - workspace-data:/app/workspaces
      # Docker Socket（支持 Docker 工作区沙箱）
      - /var/run/docker.sock:/var/run/docker.sock

  webui-backend:
    image: webui-backend:dev
    # build:
    #   context: ../examples/web_ui/backend
    #   dockerfile: Dockerfile
    ports: ["${WEBUI_BACKEND_HOST_PORT:-3000}:3000"]
    environment:
      - AGENTSCOPE_API_URL=http://agentscope:8000
    depends_on: [agentscope]
    volumes:
      # 挂载源码
      - ../examples/web_ui/backend/src:/app/src
      - ../examples/web_ui/backend/package.json:/app/package.json
      - ../examples/web_ui/backend/tsconfig.json:/app/tsconfig.json

  webui-frontend:
    image: webui-frontend:dev
    # build:
    #   context: ../examples/web_ui/frontend
    #   dockerfile: Dockerfile
    # 仅容器网络内可访问，统一由 nginx 网关代理（宿主机 80 由 nginx 独占）
    # dev 镜像内 vite dev server 监听 5173
    expose: ["5173"]
    environment:
      - VITE_API_URL=http://localhost:3000
    depends_on: [webui-backend]

  # 反向代理网关：统一入口（http://localhost:80）
  # /api/* → agentscope（剥掉 /api 前缀），其余 → 前端
  nginx:
    image: nginx:alpine
    # 多实例时若不需要 webui 网关，可用 NGINX_HOST_PORT=0 跳过宿主端口映射
    ports: ["${NGINX_HOST_PORT:-80}:80"]
    environment:
      # envsubst 模板变量：指向 vite dev server 容器内端口（5173）
      - FRONTEND_UPSTREAM=webui-frontend:5173
    volumes:
      # 以模板方式挂载，启动时经 envsubst 渲染为实际配置
      - ./nginx/nginx.conf:/etc/nginx/templates/default.conf.template:ro
    depends_on: [webui-frontend, webui-backend]

volumes:
  redis-data:
  workspace-data:
